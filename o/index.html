<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Open in Aquality</title>
<link rel="icon" href="../aquago.svg" type="image/svg+xml">
<style>
  :root { --bg: #f1f9fc; --surface: #fff; --text: #0b2545; --muted: #4a6382; --primary: #0077b6; --border: #d3e6f0; }
  @media (prefers-color-scheme: dark) { :root { --bg: #071a2e; --surface: #0d2540; --text: #e6f1fa; --muted: #9db4cc; --primary: #4cc3f0; --border: #1d3a5a; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { width: 100%; max-width: 380px; padding: 28px 22px; border: 1px solid var(--border); border-radius: 16px; background: var(--surface); text-align: center; }
  img { width: 56px; height: 56px; }
  h1 { margin: 12px 0 4px; font-size: 20px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  a.btn { display: block; margin-top: 10px; padding: 14px; border-radius: 12px; font-weight: 700; text-decoration: none; }
  .primary { background: var(--primary); color: #fff; }
  .secondary { border: 1px solid var(--border); color: var(--text); }
</style>
</head>
<body>
<main>
  <img src="../aquago.svg" alt="">
  <h1>Opening Aquality…</h1>
  <p id="order"></p>
  <a class="btn primary" id="open" href="#">Open in the Aquality app</a>
  <a class="btn secondary" id="web" href="../app/">Open in the browser instead</a>
  <a class="btn secondary" href="../">Don't have the app? Download it</a>
</main>
<script>
  // Order link (from the order emails): .../o/?<order id>. Android opens the installed app on that order (aquality://open/tracking/<id>);
  // without the app, or on iPhone, the web app shows the same order.
  var id = decodeURIComponent(location.search.slice(1)).replace(/[^\w-]/g, '');
  var path = id ? 'tracking/' + encodeURIComponent(id) : '';
  var web = new URL('../app/' + path, location.href).href;
  var android = /Android/i.test(navigator.userAgent);
  var app = 'intent://open/' + path + '#Intent;scheme=aquality;package=edu.neust.waterdelivery;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  document.getElementById('order').textContent = id ? 'Order ' + id : 'Your water delivery app';
  document.getElementById('web').href = web;
  var open = document.getElementById('open');
  if (android) {
    open.href = app;
    location.href = app; // Tries right away; the button is there if the browser wants a tap first.
  } else {
    open.href = web;
    open.textContent = 'Open my order';
    location.replace(web);
  }
</script>
</body>
</html>

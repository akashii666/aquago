<!DOCTYPE html>
<html lang="en" data-beasties-container>

<head>
  <meta charset="utf-8">
  <title>AquaGo | Water Delivery</title>

  <base href="/aquago/app/">

  <meta name="description" content="Order fresh water refills and delivery with AquaGo in San Antonio, Nueva Ecija.">
  <meta name="theme-color" content="#f1f9fc">
  <meta name="color-scheme" content="light">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">

  <link rel="icon" type="image/svg+xml" href="assets/icon/aquago.svg">
  <link rel="apple-touch-icon" href="assets/icon/favicon.png">

  <!-- add to homescreen for ios -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="AquaGo">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <!-- Apply the saved light/dark choice before the app loads so the page never flashes white. -->
  <script>
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('aquago.theme'); } catch (e) {}
      document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light');
    })();
  </script>
